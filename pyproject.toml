[tool.poetry]
name = "divination-generator"
version = "0.1.0"
description = "Микросервис - генератор раскладов."
authors = ["Stepan Tikhomirov <saltikhomirov@avito.ru>"]
readme = "README.md"
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
openai = ">=1.69.0,<2.0.0"
fastapi = ">=0.111.0,<1.0.0"
python-multipart = ">=0.0.6,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0,<1.0.0"}
pydantic = ">=2.7.1,<3.0.0"
python-dotenv = ">=1.0.1,<2.0.0"
pydantic-settings = ">=2.2.1,<3.0.0"
loguru = "^0.7.3"
asyncio = "^3.4.3"
starlette = "^0.46.2"

[tool.poetry.dev-dependencies]
pytest = "^8.2.2"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.7"
respx = "^0.21.1"
ruff = "^0.11.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
